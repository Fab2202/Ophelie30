<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}OPHELIE 30{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png" />
  
  <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: rgb(5, 29,53); padding: 10px 0; position: fixed; top: 0; left: 0; width: 100%; z-index: 2000; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}

        /* header { background-color:rgb(5, 29,53); padding: 10px 0; } */
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; }
        nav ul li { margin: 0 15px; }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 20px 15px;
            display: inline-block;
        }
        nav ul li a:hover {
            background-color: rgb(4, 142,215);
            color: rgb(249,243,0);
            border-radius: 4px;
        }
        h1 { text-align: center; }

        /* Flash messages styling */
        .flashes {
          list-style: none;
          margin: 70px auto 20px;  /* margin-top accounts for fixed header */
          padding: 10px 20px;
          max-width: 900px;
          background-color: #ffefc1;
          border: 1px solid #f0c040;
          border-radius: 5px;
          font-family: Arial, sans-serif;
        }
        .flashes li {
          margin-bottom: 8px;
          font-weight: bold;
        }

    /* top-right corner image */
    .top-right-image {
      position: fixed;
      top: 5px;
      right: 5px;
      width: 70px;
      height: 70px;
      z-index: 2100;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    /* Bottom image bar container */
    .bottom-image-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #f9f9f9;
      border-top: 1px solid #ccc;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      z-index: 2000;
    }
    .bottom-image-bar img {
      height: 60px;
      width: auto;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .bottom-image-bar img:hover {
      transform: scale(1.1);
    }

    .lang-icon {
      width: 20px;
      height: 14px;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* Allow pages to add extra styles here */
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>



<header>
<nav>
  <ul>
      <li><a href="{{ url_for('index') }}">Home</a></li>
      <li><a href="{{ url_for('photos') }}">Photos</a></li>
      <li><a href="{{ url_for('livre_or') }}">Livre d'or</a></li>
  </ul>
</nav>
</header>

<!-- Flash messages block -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <ul class="flashes">
    {% for category, message in messages %}
      <li><strong>{{ category|capitalize }}:</strong> {{ message }}</li>
    {% endfor %}
    </ul>
  {% endif %}
{% endwith %}

<!-- page-specific content -->
{% block content %}{% endblock %}

  <!-- Bottom image bar with JPEG images -->
  <div class="bottom-image-bar">
  <!-- Add more images as needed -->
  </div>




</body>
</html>
